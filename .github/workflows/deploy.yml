name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test manuscript layout
        run: node --test layout.test.mjs
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html styles.css layout.js main.js site/
          touch site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["GITHUB_SHA"][:12]
          index = Path("site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('href="./styles.css"', f'href="./styles.css?v={version}"')
          html = html.replace('src="./main.js"', f'src="./main.js?v={version}"')
          index.write_text(html, encoding="utf-8")

          main = Path("site/main.js")
          script = main.read_text(encoding="utf-8")
          script = script.replace('from "./layout.js"', f'from "./layout.js?v={version}"')
          main.write_text(script, encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for artifact indexing
        run: sleep 10
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
